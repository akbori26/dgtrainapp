spring:
  application:
    name: dragon-trainer-game
  main:
    # The CLI doesn't serve web pages, so don't start Tomcat on port 8080.
    # The web starter stays in the pom for a future web version.
    web-application-type: none
  datasource:
    # Relative to the folder the app is started from (the project root with ./mvnw spring-boot:run).
    # Set DRAGONTRAINAPP_DB_PATH to use a database somewhere else.
    url: jdbc:sqlite:${DRAGONTRAINAPP_DB_PATH:data/drogontrainapp.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ## update
      ddl-auto: none


