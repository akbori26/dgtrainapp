spring:
  application:
    name: dragon-trainer-game
  datasource:
    # Relative to the folder the app is started from (the project root with ./mvnw spring-boot:run).
    # Set DRAGONTRAINAPP_DB_PATH to use a database somewhere else.
    url: jdbc:sqlite:${DRAGONTRAINAPP_DB_PATH:data/drogontrainapp.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ## update
      ddl-auto: none



dragontrainapp:
  cors:
    # Front ends served from another origin that may call /api/** (comma-separated).
    # Defaults cover the Vite (5173) and Create React App / Next.js (3000) dev servers.
    # Set DRAGONTRAINAPP_CORS_ORIGINS to change them, e.g. for a deployed front end.
    allowed-origins: ${DRAGONTRAINAPP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
